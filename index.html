){\n    const phone = (this.state.idInput || \"\").trim();\n    if(!phone){ this.setState({loginErr:\"휴대폰번호를 입력하세요.\"}); return; }\n    if(!this.findAccount(phone)){ this.setState({loginErr:\"등록되지 않은 번호입니다 — 관리자에게 등록을 요청하세요.\"}); return; }\n    this.setState({loginBusy:true, loginErr:\"\"});\n    try {\n      const fb = await this.firebaseReady();\n      if(!fb) throw new Error(\"문자 인증이 설정되지 않았습니다 (관리자 → 계정 관리 → 로그인 인증 설정).\");\n      if(!this._recaptcha) this._recaptcha = new fb.auth.RecaptchaVerifier(\"otp-send-btn\", {size:\"invisible\"});\n      const e164 = \"+82\" + phone.replace(/\\D/g,\"\").replace(/^0/,\"\");\n      fb.auth().languageCode = \"ko\";\n      this._confirm = await fb.auth().signInWithPhoneNumber(e164, this._recaptcha);\n      this.setState({otpSent:true, loginBusy:false});\n      this.toast(\"인증번호를 발송했습니다.\");\n    } catch(e){\n      this.setState({loginBusy:false, loginErr:(e && e.message) || \"인증번호 발송에 실패했습니다.\"});\n    }\n  }\n  async confirmPhoneOtp(){\n    if(!this._confirm){ this.setState({loginErr:\"먼저 인증번호를 발송하세요.\"}); return; }\n    this.setState({loginBusy:true, loginErr:\"\"});\n    try {\n      const res = await this._confirm.confirm((this.state.otp||\"\").trim());\n      this.signIn(res.user.phoneNumber, \"phone\");\n    } catch(e){\n      this.setState({loginBusy:false, loginErr:\"인증번호가 올바르지 않거나 만료되었습니다.\"});\n    }\n  }\n\n  // Windows 캡처 도구(ms-screenclip) 실행 → 돌아오면 클립보드 이미지 자동 첨부\n  startSnip(){\n    const win = /Windows/i.test(navigator.userAgent);\n    if(!win){ this.toast(\"Windows가 아닙니다. 캡처 후 Ctrl+V로 붙여넣으세요.\"); return; }\n    this._snipT0 = Date.now();\n    this.setState({capWait:true});\n    try { const a = document.createElement(\"a\"); a.href = \"ms-screenclip:\"; a.rel = \"noopener\"; document.body.appendChild(a); a.click(); a.remove(); } catch(e){}\n    const done = ()=>{ window.removeEventListener(\"focus\", onFocus); clearTimeout(this._snipTo); };\n    const onFocus = ()=>{ setTimeout(()=>this.pullClipboardImage().then(ok=>{ if(ok || Date.now() - this._snipT0 > 60000){ done(); this.setState({capWait:false}); } }), 350); };\n    window.addEventListener(\"focus\", onFocus);\n    this._snipTo = setTimeout(()=>{ done(); if(this.state.capWait){ this.setState({capWait:false}); this.toast(\"캡처가 감지되지 않았습니다. 캡처 후 Ctrl+V로 붙여넣으세요.\"); } }, 60000);\n    this.toast(\"캡처 도구가 열립니다. 열리지 않으면 Win + Shift + S 를 누르세요.\");\n  }\n  async pullClipboardImage(){\n    if(!(navigator.clipboard && navigator.clipboard.read)) { this.toast(\"이 브라우저는 자동 첨부를 지원하지 않습니다 — Ctrl+V로 붙여넣으세요.\"); return true; }\n    try {\n      const items = await navigator.clipboard.read();\n      for(const it of items){\n        const t = it.types.find(x=>/^image\\//.test(x));\n        if(t){\n          const blob = await it.getType(t);\n          const sig = blob.size + \":\" + t;\n          if(sig === this._lastClipSig) return false;\n          this._lastClipSig = sig;\n          const ts = new Date(), p = n=>String(n).padStart(2,\"0\");\n          const f = new File([blob], \"캡처_\" + ts.getFullYear() + p(ts.getMonth()+1) + p(ts.getDate()) + \"_\" + p(ts.getHours()) + p(ts.getMinutes()) + p(ts.getSeconds()) + \".png\", {type: t});\n          this.addFiles([f], \"화면 캡처\");\n          this.toast(\"캡처 이미지를 첨부했습니다.\");\n          return true;\n        }\n      }\n    } catch(e){\n      if(e && e.name === \"NotAllowedError\"){ this.toast(\"클립보드 접근이 막혀 있습니다 — Ctrl+V로 붙여넣으세요.\"); return true; }\n    }\n    return false;\n  }\n  addFiles(list, via){\n    const files = Array.prototype.slice.call(list || []);\n    if(!files.length) return;\n    const add = [];\n    files.forEach((f,i)=>{\n      const type = f.type || \"\";\n      const isImg = type.indexOf(\"image\")===0;\n      const isPdf = type.indexOf(\"pdf\")>=0 || /\\.pdf$/i.test(f.name);\n      const isTxt = type.indexOf(\"text\")===0 || /\\.(txt|md|csv)$/i.test(f.name);\n      const entry = {\n        key: Date.now() + \"-\" + i,\n        name: f.name || ((via||\"첨부\") + \".png\"),\n        kind: isImg ? \"이미지\" : (isPdf ? \"PDF\" : (isTxt ? \"텍스트\" : \"기타\")),\n        size: Math.max(1, Math.round(f.size/1024)) + \" KB\",\n        via: via || \"파일 선택\",\n        sel: true,\n        url: isImg ? URL.createObjectURL(f) : \"\",\n        status: isTxt ? \"텍스트 추출 중\" : \"판독 대기\"\n      };\n      add.push(entry);\n      if(isImg){\n        // OCR 전송용 base64 확보\n        const rb = new FileReader();\n        rb.onload = ev=>{\n          const b64 = String(ev.target.result||\"\").split(\",\")[1] || \"\";\n          this.setState(st=>({docs:st.docs.map(d=>\n            d.key===entry.key ? Object.assign({}, d, {b64:b64, mime:type || \"image/png\"}) : d)}));\n        };\n        rb.readAsDataURL(f);\n      }\n      if(isPdf) this.readPdf(f, entry.key);\n      if(isTxt){\n        const r = new FileReader();\n        r.onload = ev=>{\n          const txt = String(ev.target.result || \"\").trim();\n          this.setState(st=>({\n            note: (st.note ? st.note + \"\\n\" : \"\") + txt,\n            docs: st.docs.map(d=>d.key===entry.key ? Object.assign({}, d, {status:\"텍스트 추출 완료\"}) : d)\n          }));\n        };\n        r.readAsText(f);\n      }\n    });\n    this.setState(st=>({docs:st.docs.concat(add), view:\"nlp\"}));\n    this.toast(add.length + \"개 문서를 첨부했습니다.\");\n  }\n\n  loadPdfJs(){\n    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);\n    if(this._pdfP) return this._pdfP;\n    const base = \"https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/\";\n    this._pdfP = new Promise((res, rej)=>{\n      const sc = document.createElement(\"script\");\n      sc.src = base + \"pdf.min.js\";\n      sc.onload = ()=>{ try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + \"pdf.worker.min.js\"; res(window.pdfjsLib); } catch(e){ rej(e); } };\n      sc.onerror = ()=>{ this._pdfP = null; rej(new Error(\"PDF 엔진을 불러오지 못했습니다\")); };\n      document.head.appendChild(sc);\n    });\n    return this._pdfP;\n  }\n\n  // PDF: 텍스트 레이어가 있으면 바로 추출, 없으면(스캔본) 쪽별 이미지로 렌더해 OCR 대상으로 저장\n  async readPdf(file, key){\n    this.setDoc(key, {status:\"PDF 읽는 중\"});\n    try {\n      const lib = await this.loadPdfJs();\n      const buf = await file.arrayBuffer();\n      const pdf = await lib.getDocument({data: buf}).promise;\n      const n = Math.min(pdf.numPages, 10);\n      const pages = []; let text = \"\"; let thumb = \"\";\n      for(let i=1;i<=n;i++){\n        const page = await pdf.getPage(i);\n        const tc = await page.getTextContent();\n        text += tc.items.map(it=>it.str + (it.hasEOL ? \"\\n\" : \" \")).join(\"\") + \"\\n\";\n        const vp = page.getViewport({scale: 2});\n        const cv = document.createElement(\"canvas\");\n        cv.width = vp.width; cv.height = vp.height;\n        await page.render({canvasContext: cv.getContext(\"2d\"), viewport: vp}).promise;\n        const url = cv.toDataURL(\"image/jpeg\", 0.85);\n        if(i===1){\n          const tcv = document.createElement(\"canvas\"); const r = 240 / cv.width;\n          tcv.width = 240; tcv.height = Math.round(cv.height * r);\n          tcv.getContext(\"2d\").drawImage(cv, 0, 0, tcv.width, tcv.height);\n          thumb = tcv.toDataURL(\"image/jpeg\", 0.8);\n        }\n        pages.push({b64: url.split(\",\")[1], mime: \"image/jpeg\"});\n      }\n      const hasText = text.replace(/\\s+/g,\"\").length >= 30;\n      this.setDoc(key, {url: thumb, pages, pdfText: hasText ? text.trim() : \"\",\n        status: (hasText ? \"텍스트 PDF · \" : \"스캔 PDF · \") + pdf.numPages + \"쪽\" + (pdf.numPages > n ? \" (앞 \" + n + \"쪽 판독)\" : \"\") + \" — 판독 대기\"});\n    } catch(e){\n      this.setDoc(key, {status:\"PDF 읽기 실패 — \" + ((e && e.message) || \"오류\")});\n    }\n  }\n\n  setDoc(key, patch){\n    this.setState(st=>({docs:st.docs.map(d=>d.key===key ? Object.assign({}, d, patch) : d)}));\n  }\n\n  // 단일 이미지 판독 — 제공자별 요청/응답 형식\n  async ocrOne(doc){\n    const s = this.state;\n    const key = s.ocrKey.trim();\n    const provider = s.ocrEngine;\n\n    // 브라우저 내장 판독 — 무료, 키 불필요, 이미지가 외부로 나가지 않음\n    if(provider.indexOf(\"브라우저\") === 0){\n      if(!window.Tesseract) throw new Error(\"판독 엔진을 불러오지 못했습니다. 네트워크를 확인하세요.\");\n      const res = await window.Tesseract.recognize(\n        \"data:\" + (doc.mime || \"image/png\") + \";base64,\" + doc.b64,\n        s.ocrLang === \"한국어 + 영어\" ? \"kor+eng\" : (s.ocrLang === \"영어\" ? \"eng\" : \"kor\"),\n        {logger: m=>{\n          if(m.status === \"recognizing text\")\n            this.setDoc(doc.key, {status:\"판독 중 \" + Math.round((m.progress||0)*100) + \"%\"});\n          else if(m.status && m.status.indexOf(\"loading\") === 0)\n            this.setDoc(doc.key, {status:\"엔진 · 언어데이터 내려받는 중\"});\n        }}\n      );\n      return (res && res.data && res.data.text) || \"\";\n    }\n\n    if(provider.indexOf(\"Google\") === 0){\n      const res = await fetch(\"https://vision.googleapis.com/v1/images:annotate?key=\" + encodeURIComponent(key), {\n        method:\"POST\",\n        headers:{\"Content-Type\":\"application/json\"},\n        body: JSON.stringify({requests:[{\n          image:{content:doc.b64},\n          features:[{type:\"DOCUMENT_TEXT_DETECTION\"}],\n          imageContext:{languageHints:[\"ko\",\"en\"]}\n        }]})\n      });\n      const j = await res.json();\n      if(j.error) throw new Error(j.error.message || \"Vision API 오류\");\n      const r = (j.responses && j.responses[0]) || {};\n      if(r.error) throw new Error(r.error.message || \"판독 오류\");\n      return (r.fullTextAnnotation && r.fullTextAnnotation.text) || \"\";\n    }\n\n    if(provider.indexOf(\"Azure\") === 0){\n      const base = s.ocrEndpoint.trim().replace(/\\/+$/,\"\");\n      if(!base) throw new Error(\"엔드포인트 주소를 입력하세요.\");\n      const bin = Uint8Array.from(atob(doc.b64), c=>c.charCodeAt(0));\n      const res = await fetch(base + \"/computervision/imageanalysis:analyze?api-version=2024-02-01&features=read\", {\n        method:\"POST\",\n        headers:{\"Ocp-Apim-Subscription-Key\":key, \"Content-Type\":\"application/octet-stream\"},\n        body: bin\n      });\n      const j = await res.json();\n      if(j.error) throw new Error((j.error.message) || \"Azure 오류\");\n      const blocks = (j.readResult && j.readResult.blocks) || [];\n      return blocks.map(b=>(b.lines||[]).map(l=>l.text).join(\"\\n\")).join(\"\\n\");\n    }\n\n    // 사용자 지정 엔드포인트 — {image:base64} 전송, {text:\"...\"} 수신\n    const url = s.ocrEndpoint.trim();\n    if(!url) throw new Error(\"엔드포인트 주소를 입력하세요.\");\n    const res = await fetch(url, {\n      method:\"POST\",\n      headers: Object.assign({\"Content-Type\":\"application/json\"}, key ? {\"Authorization\":\"Bearer \" + key} : {}),\n      body: JSON.stringify({image:doc.b64, mime:doc.mime, lang:\"ko\"})\n    });\n    const j = await res.json();\n    return j.text || j.result || j.fullText || \"\";\n  }\n\n  async runOcr(){\n    const s = this.state;\n    const picked = s.docs.filter(d=>d.sel);\n    if(!s.docs.length){ this.toast(\"첨부된 파일이 없습니다.\"); return; }\n    if(!picked.length){ this.toast(\"선택한 파일이 없습니다. 판독할 문서를 선택하세요.\"); return; }\n    const imgs = picked.filter(d=>d.kind===\"이미지\" && d.b64);\n    const pdfs = picked.filter(d=>d.kind===\"PDF\");\n    const pdfWait = pdfs.filter(d=>!d.pages && !d.pdfText);\n    if(pdfWait.length) this.toast(\"PDF를 읽는 중입니다. 잠시 후 다시 판독하세요.\");\n    const pdfTxt = pdfs.filter(d=>d.pdfText);\n    const pdfScan = pdfs.filter(d=>!d.pdfText && d.pages && d.pages.length);\n    if(!imgs.length && !pdfTxt.length && !pdfScan.length){\n      if(!pdfWait.length) this.toast(\"판독할 이미지나 PDF가 없습니다.\");\n      return;\n    }\n    const free = s.ocrEngine.indexOf(\"브라우저\") === 0;\n    let preTexts = [];\n    pdfTxt.forEach(d=>{ preTexts.push(\"[\" + d.name + \"]\\n\" + d.pdfText); this.setDoc(d.key, {status:\"텍스트 추출 완료 — 본문에 추가\"}); });\n    if(!imgs.length && !pdfScan.length){\n      this.setState(st=>({note: (st.note ? st.note + \"\\n\\n\" : \"\") + preTexts.join(\"\\n\\n\")}));\n      this.toast(pdfTxt.length + \"건 PDF 텍스트를 본문에 추가했습니다.\");\n      return;\n    }\n    if(!free && !s.ocrKey.trim()){\n      imgs.forEach(d=>this.setDoc(d.key, {status:\"인증키 미입력\"}));\n      this.toast(\"OCR 인증키를 입력하세요.\");\n      return;\n    }\n    this.setState({ocrRunning:true});\n    let ok = pdfTxt.length, texts = preTexts;\n    for(let i=0;i<pdfScan.length;i++){\n      const d = pdfScan[i]; const parts = [];\n      try {\n        for(let p=0;p<d.pages.length;p++){\n          this.setDoc(d.key, {status:\"판독 중 \" + (p+1) + \"/\" + d.pages.length + \"쪽\"});\n          const t = await this.ocrOne(Object.assign({}, d, d.pages[p]));\n          if(t && t.trim()) parts.push(t.trim());\n        }\n        if(!parts.length) throw new Error(\"문자를 찾지 못했습니다.\");\n        texts.push(\"[\" + d.name + \"]\\n\" + parts.join(\"\\n\"));\n        this.setDoc(d.key, {status:\"판독 완료 — 본문에 추가\"}); ok++;\n      } catch(e){ this.setDoc(d.key, {status:\"판독 실패 — \" + ((e && e.message) || \"오류\")}); }\n    }\n    for(let i=0;i<imgs.length;i++){\n      const d = imgs[i];\n      this.setDoc(d.key, {status:\"판독 중\"});\n      try {\n        const txt = await this.ocrOne(d);\n        if(!txt.trim()) throw new Error(\"문자를 찾지 못했습니다.\");\n        texts.push(\"[\" + d.name + \"]\\n\" + txt.trim());\n        this.setDoc(d.key, {status:\"판독 완료 — 본문에 추가\"});\n        ok++;\n      } catch(e){\n        this.setDoc(d.key, {status:\"판독 실패 — \" + ((e && e.message) || \"오류\")});\n      }\n    }\n    this.setState(st=>({\n      note: (st.note ? st.note + \"\\n\\n\" : \"\") + texts.join(\"\\n\\n\"),\n      ocrRunning:false\n    }));\n    this.toast(ok ? ok + \"건 판독 결과를 본문에 추가했습니다. 원문과 대조하세요.\" : \"판독에 실패했습니다. 키와 엔드포인트를 확인하세요.\");\n  }\n\n  // ── AI 해석: 본문 텍스트를 실제 AI에 보내 용어 해석 + 코드 후보를 받는다\n  async aiAnalyze(){\n    const text = (this.state.note || \"\").trim();\n    if(!text){ this.toast(\"분석할 본문이 없습니다.\"); return; }\n    if(!(window.claude && window.claude.complete)){\n      this.setState({aiErr:\"이 환경에서 AI 호출을 사용할 수 없습니다.\"});\n      return;\n    }\n    this.setState({aiRunning:true, aiErr:\"\", aiRows:null});\n    const sys = \"당신은 한국의 보건의료정보관리사입니다. 의무기록에서 진단을 추출해 한국질병사인분류(KCD 8차) 코드를 제안합니다. \"\n      + \"반드시 JSON 배열만 출력하세요. 각 항목: \"\n      + '{\"term\":\"기록 속 원문 표현\",\"ko\":\"한글 해석\",\"code\":\"KCD 코드\",\"role\":\"주진단|부진단|참고\",\"conf\":0-100,\"why\":\"근거 한 문장\"}. '\n      + \"주진단은 자원을 가장 많이 소비하게 한 진단 하나입니다. 과거력에만 있는 진단은 참고로 표시하세요. \"\n      + \"확신이 없으면 conf를 낮추고, 코드가 불확실하면 3단위까지만 쓰세요. 설명 문장이나 코드블록 표기 없이 JSON만 출력합니다.\";\n    try {\n      const out = await window.claude.complete({\n        model: \"claude-sonnet-4-5\",\n        max_tokens: 2000,\n        system: sys,\n        messages: [{role:\"user\", content: text}]\n      });\n      const m = String(out||\"\").match(/\\[[\\s\\S]*\\]/);\n      if(!m) throw new Error(\"응답 형식을 해석할 수 없습니다.\");\n      const rows = JSON.parse(m[0]);\n      this.setState({aiRows: Array.isArray(rows) ? rows : [], aiRunning:false});\n      this.toast(\"AI 해석 \" + rows.length + \"건을 받았습니다.\");\n    } catch(e){\n      this.setState({aiRunning:false, aiErr: (e && e.message) || \"AI 호출에 실패했습니다.\"});\n    }\n  }\n\n  // ── 임상 텍스트 NLP + 주/부진단 추천\n  analyzeText(text){\n    const lines = (text||\"\").split(/\\n+/);\n    const found = {};\n    let recRes = 0, recHit = [];   // 기록 전체의 자원소비 신호\n    lines.forEach(line=>{\n      const low = norm(line);\n      if(!low) return;\n      // 줄 앞머리의 [섹션] 표지를 우선 사용하고, 없으면 일치 중 최고 가중치를 채택\n      let sec = {w:0.4, name:\"기타 기술\"};\n      const head = low.match(/^\\s*[\\[(<【]?\\s*([^\\])>】]{1,14})\\s*[\\])>】]/);\n      const headText = head ? head[1] : \"\";\n      let byHead = null;\n      if(headText) SECTIONS.forEach(S=>{ if(!byHead && S.keys.some(k=>headText.indexOf(norm(k))>=0)) byHead = S; });\n      if(byHead) sec = byHead;\n      else SECTIONS.forEach(S=>{ if(S.keys.some(k=>low.indexOf(norm(k))>=0) && S.w > sec.w) sec = S; });\n      let res = 0, resHit = [];\n      RESOURCE.forEach(r=>{ if(low.indexOf(r[0])>=0){ res += r[1]; resHit.push(r[0]); } });\n      if(res){ recRes += res; resHit.forEach(r=>{ if(recHit.indexOf(r)<0) recHit.push(r); }); }\n      NLP_TERMS.forEach(t=>{\n        const hit = t.keys.filter(k=>{\n          const nk = norm(k);\n          return nk.length >= 2 && low.indexOf(nk) >= 0;\n        });\n        if(!hit.length) return;\n        const key = t.code;\n        if(!found[key]) found[key] = {code:t.code, ko:t.label, label:t.label, score:0,\n          sections:[], res:0, resHit:[], hits:[], spec:t.spec||0, len:0,\n          concept: t.concept || \"\"};\n        const f = found[key];\n        if(!f.concept && t.concept) f.concept = t.concept;\n        f.spec = Math.max(f.spec, t.spec||0);\n        f.len = Math.max(f.len, Math.max.apply(null, hit.map(h=>h.length)));\n        f.score += sec.w * 40;\n        if(f.sections.indexOf(sec.name)<0) f.sections.push(sec.name);\n        f.res += res; f.hits = f.hits.concat(hit.slice(0,1));\n        resHit.forEach(r=>{ if(f.resHit.indexOf(r)<0) f.resHit.push(r); });\n      });\n    });\n    let arr = Object.keys(found).map(k=>found[k]);\n    // 원인균·부위가 명시된 더 구체적인 코드가 있으면 상위(덜 구체적인) 코드는 제외\n    const drop = {};\n    arr.forEach(a=>arr.forEach(b=>{\n      if(a===b) return;\n      // 같은 3단위 계열 — 문구가 더 긴(구체적인) 쪽을 채택\n      if(b.code.indexOf(a.code.slice(0,3))===0 && b.len > a.len && b.spec >= a.spec) drop[a.code] = true;\n      // 부모-자식 관계 — 부모(불완전) 제외\n      if(hasChild(a.code) && b.code!==a.code && b.code.indexOf(a.code)===0) drop[a.code] = true;\n      // 같은 임상 개념군(선도어) — 상세불명 코드는 구체적 코드가 있으면 제외\n      if(a.concept && a.concept===b.concept && a.code!==b.code\n         && isVague(a.label) && !isVague(b.label)) drop[a.code] = true;\n    }));\n    // 확정 진단이 추출되면 R장 증상 · 징후 코드는 제외 (증상 코드 병기는 삭감 사유)\n    const definite = arr.some(a=>a.code.charAt(0)!==\"R\" && a.code.charAt(0)!==\"Z\");\n    if(definite) arr.forEach(a=>{ if(a.code.charAt(0)===\"R\") drop[a.code] = true; });\n    arr = arr.filter(a=>!drop[a.code]);\n    // 구체성(세분류·수식어 일치)과 일치 문구 길이를 점수에 반영\n    arr.forEach(f=>{ f.total = f.score + f.res + f.spec * 14 + Math.min(20, f.len); });\n    arr.sort((a,b)=>b.total-a.total);\n    const max = arr.length ? arr[0].total : 1;\n    return arr.map((f,i)=>{\n      const past = f.sections.length===1 && f.sections[0]===\"과거력 · 가족력\";\n      // 주진단에는 기록 전체의 자원소비 신호를 귀속시킨다 (치료·처치는 별도 섹션에 기술됨)\n      const resPts = i===0 ? Math.max(f.res, recRes) : f.res;\n      const resWhat = (i===0 ? recHit : f.resHit).slice(0,4).join(\" · \");\n      return Object.assign(f, {\n        rank: i,\n        role: past ? \"참고(과거력)\" : (i===0 ? \"주진단\" : \"부진단\"),\n        conf: Math.min(97, Math.round(58 + 39 * f.total / max)),\n        reason: (past ? \"과거력에만 기술됨 — 청구 진단 제외 검토\"\n          : (i===0\n              ? \"자원소비 \" + resPts + \"점\" + (resWhat ? \" (\" + resWhat + \")\" : \"\") + \" · \" + f.sections.join(\" · \") + \" 기술\"\n              : f.sections.join(\" · \") + \" 기술 · 자원소비 \" + resPts + \"점\"))\n      });\n    }).slice(0,8);\n  }\n\n  // ── 룰 엔진\n  runRules(){\n    const s = this.state;\n    const age = parseInt(s.ptAge,10);\n    const sex = s.ptSex;\n    const rows = s.claim.filter(c=>c.code.trim());\n    const out = [];\n    const seen = {};\n\n    rows.forEach((r,i)=>{\n      const code = r.code.trim().toUpperCase();\n      const unit = unitOf(code);\n      if(!codeKnown(code) && !hasChild(code))\n        out.push({sev:\"확인\", code, title:\"색인에 없는 코드\", note:\"KCD 마스터에 존재하지 않거나 시연 색인 미수록 — 표제부 확인이 필요합니다.\"});\n      if(hasChild(code))\n        out.push({sev:\"삭감\", code, title:\"불완전 코드 기재\", row:i,\n          note:\"하위 세분류가 존재합니다. 최말단(\" + (unit+1) + \"단위 이상) 코드까지 지정해야 청구 가능합니다.\",\n          fixLabel:\"아래 세분류 중 하나로 교체하세요\",\n          alts:childCodes(code)});\n      const sx = codeSexIssue(code, sex);\n      if(sx){\n        const a = altCodes(code, sex, age);\n        out.push(a.length\n          ? {sev:\"삭감\", code, title:\"성별 불일치\", row:i,\n             note:sx + \" — 현재 환자 성별: \" + (sex===\"M\"?\"남\":\"여\"),\n             fixLabel:\"성별 제약이 없는 같은 계열 코드\", alts:a}\n          : {sev:\"삭감\", code, title:\"성별 불일치\", row:i,\n             note:sx + \" — 현재 환자 성별: \" + (sex===\"M\"?\"남\":\"여\") + \". 이 계열에는 해당 성별에 사용 가능한 코드가 없습니다.\",\n             fixLabel:\"기재 오류로 판단되면 삭제, 성별 입력이 잘못되었다면 성별을 정정하세요\",\n             alts:[code], removeOne:true,\n             flipSex: sex===\"M\" ? \"F\" : \"M\"});\n      }\n      const ag = !isNaN(age) ? codeAgeIssue(code, age) : null;\n      if(ag){\n        const a = altCodes(code, sex, age);\n        out.push(a.length\n          ? {sev:\"삭감\", code, title:\"연령 불일치\", row:i,\n             note:ag + \" — 현재 환자 연령: \" + age + \"세\",\n             fixLabel:\"해당 연령에 사용 가능한 같은 계열 코드\", alts:a}\n          : {sev:\"삭감\", code, title:\"연령 불일치\", row:i,\n             note:ag + \" — 현재 환자 연령: \" + age + \"세. 이 계열에는 해당 연령에 사용 가능한 코드가 없습니다.\",\n             fixLabel:\"기재 오류로 판단되면 삭제, 연령 입력이 잘못되었다면 연령을 정정하세요\",\n             alts:[code], removeOne:true});\n      }\n      if(r.kind===\"주진단\"){\n        const np = codeNoPrimary(code);\n        if(np) out.push({sev:\"삭감\", code, title:\"주진단 불가 코드\", row:i,\n          note:np,\n          fixLabel:\"이 코드를 부진단으로 내리고 아래 중 하나를 주진단으로\",\n          alts:primaryAlts(rows.map(x=>x.code.trim().toUpperCase()), code, sex, age),\n          demote:true});\n      }\n      if(seen[code]) out.push({sev:\"조정\", code, title:\"중복 코드\", row:i,\n        note:\"동일 명세서 내 \" + code + \" 가 2회 이상 기재되었습니다.\",\n        fixLabel:\"중복 행 삭제\", dedupe:true});\n      seen[code] = true;\n    });\n\n    const primary = rows.filter(r=>r.kind===\"주진단\");\n    if(primary.length===0) out.push({sev:\"삭감\", code:\"—\", title:\"주진단 누락\",\n      note:\"명세서에 주진단이 지정되지 않았습니다.\",\n      fixLabel:\"아래 코드 중 하나를 주진단으로 지정\",\n      alts:primaryAlts(rows.map(x=>x.code.trim().toUpperCase()), \"\", sex, age),\n      promote:true});\n    if(primary.length>1) out.push({sev:\"삭감\", code:\"—\", title:\"주진단 중복 지정\",\n      note:\"주진단은 1개만 기재할 수 있습니다. 현재 \" + primary.length + \"개.\",\n      fixLabel:\"주진단으로 남길 코드를 선택 (나머지는 부진단으로 변경)\",\n      alts:primary.map(p=>p.code.trim().toUpperCase()),\n      keepOne:true});\n\n    const codes = rows.map(r=>r.code.trim().toUpperCase());\n    const hasDefinite = codes.some(c=>c.charAt(0)!==\"R\" && c.charAt(0)!==\"Z\" && c);\n    if(hasDefinite) rows.forEach(r=>{\n      const code = r.code.trim().toUpperCase();\n      if(code.charAt(0)===\"R\")\n        out.push({sev:\"조정\", code, title:\"증상 코드 병기\",\n          note:\"확정 진단이 함께 기재되어 있습니다. 증상 · 징후(R장) 코드는 원인 진단이 확인되면 생략합니다.\",\n          fixLabel:\"이 코드를 삭제\", alts:[code], removeOne:true});\n    });\n\n    RULE_EXCLUSIVE.forEach(r=>{\n      const ha = codes.some(c=>r.a.some(p=>c.indexOf(p)===0));\n      const hb = codes.some(c=>r.b.some(p=>c.indexOf(p)===0));\n      if(ha && hb){\n        const involved = codes.filter(c=>r.a.some(p=>c.indexOf(p)===0) || r.b.some(p=>c.indexOf(p)===0));\n        out.push({sev:\"조정\", code:r.a[0] + \" + \" + r.b[0], title:\"논리 모순 · 배타 관계\", note:r.note,\n          fixLabel:\"둘 중 하나만 남기세요 — 삭제할 코드를 선택\",\n          alts:involved, removeOne:true});\n      }\n    });\n\n    const ver = versionFor(s.visitDate);\n    rows.forEach(r=>{\n      const code = r.code.trim().toUpperCase();\n      CODE_HISTORY.forEach(h=>{\n        if(h.code===code){\n          const cur = h.changes.filter(c=>c.ver===ver.name)[0];\n          if(cur && cur.code !== code)\n            out.push({sev:\"확인\", code, title:\"버전 불일치\",\n              note:\"진료일(\" + s.visitDate + \") 적용 버전은 \" + ver.name + \" — 해당 버전 코드는 \" + cur.code + \" 입니다.\",\n              fixLabel:ver.name + \" 코드로 교체\", alts:[cur.code], row:rows.indexOf(r)});\n        }\n      });\n    });\n\n    const sev = {\"삭감\":0, \"조정\":1, \"확인\":2};\n    out.sort((a,b)=>sev[a.sev]-sev[b.sev]);\n    this.setState({findings:out, ruleRan:true});\n  }\n\n  // 제안 적용 — 교체 / 부진단 강등 / 주진단 승격 / 삭제 / 중복 정리\n  applyFix(f, pick){\n    const cur = (f.code||\"\").trim().toUpperCase();\n    this.setState(st=>{\n      let claim = st.claim.slice();\n      if(f.dedupe){\n        const seen = {};\n        claim = claim.filter(c=>{\n          const k = c.code.trim().toUpperCase();\n          if(seen[k]) return false;\n          seen[k] = true; return true;\n        });\n      } else if(f.removeOne){\n        claim = claim.filter(c=>c.code.trim().toUpperCase() !== pick);\n      } else if(f.keepOne){\n        claim = claim.map(c=>{\n          const k = c.code.trim().toUpperCase();\n          if(c.kind!==\"주진단\") return c;\n          return {code:c.code, kind: k===pick ? \"주진단\" : \"부진단\"};\n        });\n      } else if(f.promote){\n        claim = claim.map(c=>({code:c.code,\n          kind: c.code.trim().toUpperCase()===pick ? \"주진단\" : c.kind}));\n      } else if(f.demote){\n        claim = claim.map(c=>{\n          const k = c.code.trim().toUpperCase();\n          if(k===cur) return {code:c.code, kind:\"부진단\"};\n          if(k===pick) return {code:c.code, kind:\"주진단\"};\n          return c;\n        });\n      } else {\n        // 기본: 해당 행의 코드를 제안 코드로 교체\n        let done = false;\n        claim = claim.map(c=>{\n          if(!done && c.code.trim().toUpperCase()===cur){ done = true; return {code:pick, kind:c.kind}; }\n          return c;\n        });\n        if(!done) claim = claim.concat([{code:pick, kind:\"부진단\"}]);\n      }\n      return {claim};\n    }, ()=>{ this.runRules(); });\n    this.toast(f.dedupe ? \"중복 코드를 정리했습니다.\"\n      : (f.removeOne ? pick + \" 를 삭제했습니다.\"\n      : (f.keepOne || f.promote ? pick + \" 를 주진단으로 지정했습니다.\"\n      : (f.demote ? cur + \" → 부진단, \" + pick + \" → 주진단으로 변경했습니다.\"\n      : cur + \" → \" + pick + \" 로 교체했습니다.\"))));\n  }\n\n  // ── 선도어 트리 편집 (관리자 · 코더 제안)\n  // before = 변경 '전' 트리 스냅샷 (문자열). 생략 시 현재 상태를 뜬다.\n  ltLog(action, detail, before){\n    const now = new Date();\n    const at = now.toISOString().slice(0,10) + \" \" + now.toTimeString().slice(0,5);\n    const s = this.state;\n    const who = s.user ? s.user.id : \"—\";\n    const role = s.user ? s.user.role : s.role;\n    const snap = before || JSON.stringify(s.ltTrees);\n    this.setState(st=>({ltAudit:[{at, who, action, detail,\n      status: isSys(role) ? \"반영\" : \"승인 대기\",\n      snapshot: snap}].concat(st.ltAudit).slice(0,30)}));\n  }\n  ltParseUpload(text){\n    // 형식: 선도어 | 수식어경로(>구분) | 코드 | 동의어(,구분)\n    const lines = (text||\"\").split(/\\n+/).map(l=>l.trim()).filter(Boolean);\n    let added = 0, terms = {};\n    const before = JSON.stringify(this.state.ltTrees);\n    const trees = JSON.parse(before);\n    lines.forEach(line=>{\n      if(/^(선도어|lead)\\b/i.test(line)) return;\n      const p = line.split(/\\s*[|\\t,;]\\s*/);\n      const lead = (p[0]||\"\").trim();\n      if(!lead) return;\n      const path = (p[1]||\"\").split(\">\").map(x=>x.trim()).filter(Boolean);\n      const code = (p[2]||\"\").trim().toUpperCase();\n      const syn = (p[3]||\"\").split(/[/·]/).map(x=>x.trim()).filter(Boolean);\n      let node = trees.filter(t=>t.term===lead)[0];\n      if(!node){ node = {term:lead, code:path.length ? \"\" : code, kids:[], syn:[]}; trees.push(node); }\n      if(!path.length){ if(code) node.code = code; node.syn = (node.syn||[]).concat(syn); }\n      else {\n        let cur = node;\n        path.forEach((m,i)=>{\n          let nx = (cur.kids||[]).filter(k=>k.mod===m)[0];\n          if(!nx){ nx = {mod:m, code:\"\", kids:[], syn:[]}; cur.kids.push(nx); }\n          if(i===path.length-1){ if(code) nx.code = code; nx.syn = (nx.syn||[]).concat(syn); }\n          cur = nx;\n        });\n      }\n      terms[lead] = true; added++;\n    });\n    if(!added){ this.toast(\"읽을 수 있는 행이 없습니다. 형식을 확인하세요.\"); return; }\n    this.setState({ltTrees:trees, ltDirty:true});\n    this.ltLog(\"일괄 업로드\", added + \"행 · 선도어 \" + Object.keys(terms).length + \"개\", before);\n    this.toast(added + \"행을 반영했습니다.\");\n  }\n\n  // ── 선도어 자동 생성: KCD 분류명에서 선도어(질병 본질 명사)와 수식어를 분리해 트리를 만든다\n  ltAutoBuild(silent){\n    const LEAD_NOUNS = [\"악성신생물\",\"양성 신생물\",\"이차성 악성신생물\",\"상피내암종\",\"신생물\",\"골절\",\"염좌\",\"열린상처\",\"외상성 절단\",\"탈장\",\n      \"폐렴\",\"폐염\",\"당뇨병\",\"고혈압\",\"협심증\",\"심근경색증\",\"뇌경색증\",\"심장기능상실\",\"콩팥기능상실\",\"부정맥\",\"잔떨림\",\n      \"위염\",\"복막염\",\"충수염\",\"담낭염\",\"췌장염\",\"간염\",\"장염\",\"결장염\",\"방광염\",\"신염\",\"관절염\",\"관절증\",\"피부염\",\"비염\",\"부비동염\",\"인두염\",\"편도염\",\"기관지염\",\"중이염\",\"외이도염\",\"수막염\",\"뇌염\",\n      \"궤양\",\"결석\",\"빈혈\",\"백혈병\",\"림프종\",\"조직구증\",\"출혈\",\"농양\",\"낭\",\"경화\",\"간경변증\",\"폐색전증\",\"혈전증\",\"동맥류\",\"정맥류\",\n      \"감염\",\"패혈증\",\"결핵\",\"통증\",\"두통\",\"통풍\",\"천식\",\"녹내장\",\"백내장\",\"치질\",\"변비\",\"부종\",\"손상\",\"증후군\",\"장애\",\"질환\",\"병\"];\n    const GENERIC_SUFFIX = [\"병\",\"증후군\",\"장애\",\"질환\",\"손상\",\"감염\",\"통증\",\"증\"];\n    const nouns = LEAD_NOUNS.slice().sort((a,b)=>b.length-a.length);\n    // 이전 규칙으로 잘못 만들어진 자동 항목은 버리고 다시 만든다 (사용자 추가 · 기본 선도어는 유지)\n    const trees = ltNormalize(JSON.parse(JSON.stringify(this.state.ltTrees || [])))\n      .filter(t=>!t.auto)\n      .map(t=>{ const strip = l=>(l||[]).filter(k=>!k.auto).map(k=>Object.assign(k, {kids:strip(k.kids)})); t.kids = strip(t.kids); return t; });\n    const byTerm = {}; trees.forEach(t=>{ byTerm[t.term] = t; });\n    const clean = x=>(x||\"\").replace(/의\\s*$/,\"\").replace(/^[,\\s·]+|[,\\s·]+$/g,\"\").replace(/\\s+/g,\" \").trim();\n    let newLeads = 0, newMods = 0;\n    UNIVERSE_KEYS.filter(k=>!hasChild(k)).sort().forEach(code=>{\n      const label = UNIVERSE[code] || \"\";\n      if(/\\(범주\\)/.test(label)) return;\n      const head = label.split(/,\\s*/)[0];                 // 쉼표 앞 = 질환 본문\n      const parts = label.split(/,\\s*/);\n      // 선도어는 쉼표 앞 본문의 '마지막 어절'에서만 찾는다 (어절 중간 일치 금지: 합병증 · 낭성섬유증 · 신생물의 …)\n      const s0 = head.lastIndexOf(\" \") + 1;\n      const lastTok = head.slice(s0);\n      let lead = nouns.filter(n=>lastTok === n || (lastTok.length > n.length && lastTok.slice(-n.length) === n))[0];\n      let i;\n      if(lead){\n        i = s0 + lastTok.length - lead.length;\n        // 어절 안에서 앞말이 붙은 경우: 일반 접미어(병 · 증후군 · 장애 …)면 어절 전체가 고유 질환명 (파킨슨병, 공황장애)\n        // 그 밖의 명사도 어절 일부만 떼면 뜻이 깨지므로 어절 전체를 선도어로 쓴다 (대장염 → 대장염)\n        if(i > s0){ lead = lastTok; i = s0; }\n      } else {\n        // 마지막 어절이 기준 명사로 끝나지 않으면 마지막 어절을 선도어로 (수두 · 대상포진 · 낭성섬유증 · 특수선별검사)\n        lead = lastTok;\n        i = s0;\n      }\n      lead = lead.replace(/^(기타|상세불명의)\\s*/,\"\");\n      if(!lead || lead.length < 2 || /^(기타|상세불명|NOS)$/.test(lead)) return;\n      let mod1 = clean(head.slice(0, i)).replace(/^(기타|상세불명의)\\s*/,\"\");\n      if(mod1 === \"기타\" || mod1 === \"상세불명\") mod1 = \"\";\n      let mod2 = clean(parts.length > 1 ? parts.slice(1).join(\", \") : head.slice(i + lead.length));\n      if(/^상세불명/.test(mod1)) mod1 = \"\";\n      // 불명 계열 수식어는 '수식어 없음'으로 본다 → 그 코드가 선도어의 기본(상세불명) 코드 후보\n      const VAGUE = /^(상세불명|상세불명의|미생물 불명|부위 불명|원인 불명|병원체 불명|불명|NOS|합병증을 동반하지 않은)$/;\n      if(VAGUE.test(mod2)) mod2 = \"\";\n      if(VAGUE.test(mod1)) mod1 = \"\";\n      let t = byTerm[lead];\n      if(!t){ t = {term:lead, code:\"\", kids:[], syn:[], retired:false, auto:true}; trees.push(t); byTerm[lead] = t; newLeads++; }\n      if(!mod1 && !mod2){ if(!t.code) t.code = code; return; }\n      const addMod = (list, m, c)=>{\n        let n = list.filter(k=>k.mod===m)[0];\n        if(!n){ n = {mod:m, code:c||\"\", kids:[], syn:[], auto:true}; list.push(n); newMods++; }\n        else if(!n.code && c) n.code = c;\n        if(!Array.isArray(n.kids)) n.kids = [];\n        return n;\n      };\n      if(mod1 && mod2){ addMod(addMod(t.kids, mod1, \"\").kids, mod2, code); }\n      else addMod(t.kids, mod1 || mod2, code);\n    });\n    // 기본 코드: 불명 계열 최말단 코드만 인정. 없으면 비워 두고 수식어 선택을 요구한다 (3단위 절단 금지)\n    trees.forEach(t=>{\n      const c = (t.code||\"\").toUpperCase();\n      if(c && (hasChild(c) || !codeKnown(c))) t.code = \"\";\n    });\n    // 같은 이름의 선도어는 하나로 합친다 (이전 저장본의 이름 바뀐 항목 대응)\n    const merged = [], seenT = {};\n    trees.forEach(t=>{\n      const prev = seenT[t.term];\n      if(!prev){ seenT[ sNames.length ? a + \" \" + r.disNames[0] : a, a===site, r.disNames.length ? a + \" \" + r.disNames[0] + \" 검색\" : \"\")),\n          types: r.disTypes.map(t=>chipOf(t, site ? site + \" \" + t : t, r.disNames.indexOf(t) >= 0)),\n          hasSiteGroups: r.siteGroups.length > 0,\n          siteTitle: r.siteTitle || (site ? \"‘\" + site + \"’ 부위의 관련 질환\" : \"관련 질환\"),\n          siteGroups: r.siteGroups.map(g=>({type:g.type, n:g.items.length, bg: g.own ? \"var(--color-accent-100)\" : \"transparent\",\n            items: g.items.map(i=>({code:i.code, label:i.label, en:enOf(i.code), tip:i.label + (enOf(i.code) ? \" · \" + enOf(i.code) : \"\"), go:go(i.code)}))})),\n          hasSameDis: r.sameDis.length > 0,\n          noLists: !r.siteGroups.length && !r.sameDis.length,\n          disTitle: r.disTitle || (\"같은 질환 · 다른 부위 (\" + r.disNames.join(\" · \") + \")\"),\n          sameDis: r.sameDis.map(i=>({code:i.code, label:i.label, en:enOf(i.code), tip:i.label + (enOf(i.code) ? \" · \" + enOf(i.code) : \"\"), site:i.site, cols: i.site ? \"64px 56px minmax(0,1fr)\" : \"64px 0 minmax(0,1fr)\", go:go(i.code)}))\n        };\n      })(),\n\n      ...this.dashVals(),\n      ...this.userMgmtVals(role),\n\n      uploadState:s.uploadState,\n      onKcdFile: e=>this.kcdUpload(e),\n      kcdClear: ()=>this.kcdClear(),\n      kcdBusy: !!s.kcdBusy, kcdBusyOp: s.kcdBusy ? 0.5 : 1,\n      kcdBtn: s.kcdBusy ? \"읽는 중…\" : \"KCD 파일 선택\",\n      kcdLoaded: !!(s.kcdInfo && s.kcdInfo.rows),\n      kcdTotal: (s.kcdInfo ? s.kcdInfo.total : UNIVERSE_KEYS.length).toLocaleString(),\n      kcdLeaf: (s.kcdInfo ? s.kcdInfo.leaf : kcdStats().leaf).toLocaleString(),\n      kcdSrc: s.kcdInfo ? s.kcdInfo.src : \"내장 사전\",\n      kcdHint: s.kcdInfo && /깨짐/.test(s.kcdInfo.src||\"\")\n        ? \"저장된 적재본(\" + s.kcdInfo.rows + \"행)은 한글이 깨져 무시하고 내장 사전을 사용 중입니다. 시스템 관리자로 ‘적재 삭제’를 눌러 지워 주세요.\"\n        : s.kcdInfo && s.kcdInfo.rows\n        ? \"적재 \" + s.kcdInfo.rows.toLocaleString() + \"행 · 새 코드 \" + s.kcdInfo.added.toLocaleString() + \"개 추가 · AI 제안 코드도 이 목록으로 대조합니다.\"\n        : \"내장 사전은 일부 코드만 포함합니다. 정확한 검색을 위해 KCD 전체 분류표를 올려 주세요.\",\n      apiUrl:s.apiUrl, apiKey:s.apiKey, apiState:s.apiState,\n      onApiUrl: e=>this.setState({apiUrl:e.target.value}),\n      onApiKey: e=>this.setState({apiKey:e.target.value}),\n      testApi: ()=>this.setState({apiState: \"미지원 — 공식 공개 API 확인 전입니다. 방식 1(파일 업로드)을 사용하세요.\"}),\n      aiLevel:s.aiLevel,\n      onAiLevel: e=>this.setState({aiLevel:e.target.value}),\n      kcdMeta: s.ver + \" · 사전 우선, AI 보조\",\n      kcdRows: (()=>{\n        const ki = s.kcdInfo || {}, ok = !!ki.rows && !/깨짐/.test(ki.src||\"\");\n        const src = ok ? ki.src : \"내장 사전\", at = ok ? (ki.at || KCD_MASTER.at || \"—\") : \"—\";\n        const st = kcdStats(), leaf = st.leaf, five = st.five, syn = st.syn, en = st.en;\n        return [\n          {kind:\"분류 코드\", desc:\"3 · 4 · 5단위 코드 전체 (\" + src + \")\", count:st.total.toLocaleString(), at},\n          {kind:\"최말단 코드\", desc:\"하위 세분류가 없는 청구 가능 코드\", count:leaf.toLocaleString(), at},\n          {kind:\"5단위 세세분류\", desc:\"5자리 코드\", count:five ? five.toLocaleString() : \"미적재\", at},\n          {kind:\"동의어 · 영문\", desc:\"영문 원어 · 약어 · 한글 동의어 표기 수\", count:syn.toLocaleString(), at},\n          {kind:\"영문 병명\", desc:\"영문명이 있는 코드\", count:en.toLocaleString(), at},\n          {kind:\"포함 · 제외 지침\", desc:\"현재 업로드 파일에서 읽지 않음\", count:\"미적재\", at:\"—\"}\n        ];\n      })(),\n\n      toast:s.toast, hasToast: !!s.toast\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
