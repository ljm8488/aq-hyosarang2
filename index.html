document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-off 자동 저장되며 검색 · 코드 생성에 바로 적용됩니다.<\u002Fspan>\n              <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n              <div class=\"field\" style=\"grid-column:1 / -1\">\n                <label>진료과<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ dept }}\" sc-camel-on-change=\"{{ onDept }}\">\n                  <option>전체 진료과<\u002Foption>\n                  <option>내과<\u002Foption><option>순환기내과<\u002Foption><option>신경과<\u002Foption>\n                  <option>호흡기내과<\u002Foption><option>정형외과<\u002Foption><option>외과<\u002Foption>\n                  <option>응급의학과<\u002Foption><option>가정의학과<\u002Foption>\n                <\u002Fsc-raw-select>\n                <span class=\"text-muted\" style=\"font-size:11px\">{{ deptLexInfo }}<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"field\" style=\"grid-column:1 / -1\">\n                <label>코딩 목적<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ purpose }}\" sc-camel-on-change=\"{{ onPurpose }}\">\n                  <option>주진단<\u002Foption><option>부진단<\u002Foption><option>외래 청구<\u002Foption><option>사망원인<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>KCD<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ ver }}\" sc-camel-on-change=\"{{ onVer }}\">\n                  <option>KCD 8차<\u002Foption><option>KCD 7차<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>정확도<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ minAcc }}\" sc-camel-on-change=\"{{ onMinAcc }}\">\n                  <option value=\"0\">전체<\u002Foption>\n                  <option value=\"50\">50% 이상<\u002Foption>\n                  <option value=\"70\">70% 이상<\u002Foption>\n                  <option value=\"85\">85% 이상<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center\">\n              <span class=\"text-muted\" style=\"font-size:12px;flex-basis:100%\">데이터 소스<\u002Fspan>\n              <sc-for list=\"{{ sourceToggles }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <label class=\"radio\" style=\"gap:8px\">\n                  <input type=\"checkbox\" checked=\"{{ s.on }}\" sc-camel-on-change=\"{{ s.toggle }}\" style=\"position:absolute;opacity:0;width:0;height:0\">\n                  <span class=\"dot\" style=\"border-radius:4px;background:{{ s.fill }};border-color:var(--color-accent)\"><\u002Fspan>\n                  {{ s.label }}\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n        <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\">\n            <a class=\"btn btn-primary\" href=\"#/search\" style=\"text-decoration:none\">검색 · 코드 생성으로 이동<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isIndex }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:16px\">\n          <div>\n            <h2 style=\"margin:0\">KCD 제3권 색인 검색<\u002Fh2>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:4px 0 0\">선도어를 고르고 수식어(하이픈 하위어)를 따라가면 최종 분류코드에 도달합니다. 1권 분류표의 분류명이 단계마다 표시됩니다.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding:16px;gap:12px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n              <h6 style=\"margin:0\">선도어 (Main term)<\u002Fh6>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleAddLead }}\" aria-expanded=\"{{ addLeadOpen }}\" style=\"font-size:13px\">{{ addLeadLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n              <input class=\"input\" value=\"{{ leadFilter }}\" placeholder=\"선도어 찾기 — 예: 골절, 염\" sc-camel-on-change=\"{{ onLeadFilter }}\" aria-label=\"선도어 찾기\" style=\"max-width:280px;min-height:34px;font-size:13px\">\n              <span class=\"text-muted\" style=\"font-size:12px\">{{ leadCountText }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;max-height:220px;overflow-y:auto;padding:2px\">\n              <sc-for list=\"{{ leads }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <button class=\"btn btn-secondary\" aria-current=\"{{ l.on }}\" sc-camel-on-click=\"{{ l.pick }}\" style=\"font-size:13px;background:{{ l.bg }};border-color:{{ l.bd }}\">{{ l.label }} <span class=\"text-muted\" style=\"font-size:11px\">{{ l.en }}<\u002Fspan>\n                  <sc-if value=\"{{ l.custom }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span class=\"tag tag-outline\" style=\"font-size:10px;padding:0 6px\">사용자 추가<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ addLeadOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1px solid var(--color-accent);border-radius:var(--r-box);padding:14px;display:grid;gap:10px;background:var(--color-accent-100)\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end\">\n                  <div class=\"field\">\n                    <label>선도어 (한글 명사 — 질병의 본질)<\u002Flabel>\n                    <input class=\"input\" value=\"{{ newLeadTerm }}\" placeholder=\"예: 염좌\" sc-camel-on-change=\"{{ onNewLeadTerm }}\">\n                  <\u002Fdiv>\n                  <div class=\"field\">\n                    <label>영문 원어<\u002Flabel>\n                    <input class=\"input\" value=\"{{ newLeadEn }}\" placeholder=\"예: Sprain\" sc-camel-on-change=\"{{ onNewLeadEn }}\">\n                  <\u002Fdiv>\n                  <div class=\"field\">\n                    <label>기본 코드 (상세불명 코드)<\u002Flabel>\n                    <input class=\"input mono\" value=\"{{ newLeadCode }}\" placeholder=\"예: T14.3\" sc-camel-on-change=\"{{ onNewLeadCode }}\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasNewLeadMsg }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"font-size:12px;margin:0;color:var(--color-accent-900)\">{{ newLeadMsg }}<\u002Fp>\n                <\u002Fsc-if>\n                <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ addLead }}\">선도어 추가<\u002Fbutton>\n                  <span class=\"text-muted\" style=\"font-size:11px\">{{ addLeadNote }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;display:grid;gap:4px\">\n              <div class=\"text-muted\" style=\"font-size:11px;font-weight:600\">선도어 작성 기준 (KCD 제3권 색인 표기 규칙)<\u002Fdiv>\n              <ol class=\"text-muted\" style=\"font-size:11px;line-height:1.65;margin:0;padding-left:16px\">\n                <li>질병의 <b>본질을 나타내는 명사<\u002Fb>를 선도어로 씁니다 — 폐렴, 골절, 당뇨병, 위염.<\u002Fli>\n                <li>해부학적 부위, 유형, 원인균, 급성/만성, 개방/폐쇄는 선도어가 아니라 <b>수식어<\u002Fb>로 내립니다 — “대퇴골 골절”은 선도어 골절 + 수식어 대퇴골.<\u002Fli>\n                <li>형용사 · 기간 · 중증도로 시작하지 않습니다 — “만성 위염”(×) → 위염 + 만성(○).<\u002Fli>\n                <li>인명 증후군 · 고유 질환명은 그 자체가 선도어입니다 — 크론병, 쉐그렌증후군.<\u002Fli>\n                <li>선도어의 기본 코드는 수식어가 없을 때 쓰는 <b>상세불명 코드<\u002Fb>입니다 — 폐렴 J18.9.<\u002Fli>\n                <li>이 목록은 앱을 열 때 <b>KCD 분류명에서 자동으로 만들어집니다<\u002Fb> — 분류명의 질병 명사가 선도어, 그 앞의 부위 · 유형이 1단 수식어, 쉼표 뒤(폐쇄성 · 개방성 등)가 2단 수식어가 됩니다. 별도로 관리할 필요가 없습니다.<\u002Fli>\n              <\u002Fol>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding:18px;gap:14px\">\n                        <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n              <sc-for list=\"{{ idxTrail }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ t.go }}\" style=\"font-size:12px;padding:2px 6px\">{{ t.label }} <span class=\"mono\">{{ t.code }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end;border-top:1px solid var(--color-divider);padding-top:12px\">\n              <div>\n                <div class=\"card-kicker\">현재 단계 분류<\u002Fdiv>\n                <div style=\"font-size:16px\">{{ idxLabel }}<\u002Fdiv>\n                <div class=\"text-muted mono\" style=\"font-size:11px\">{{ idxUnit }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"mono\" style=\"font-size:30px;font-weight:700;color:var(--color-accent-800);line-height:1.1\">{{ idxCode }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ idxTerminal }}\" hint-placeholder-val=\"{{ false }}\">\n              <p class=\"text-muted\" style=\"font-size:12px;margin:0\">더 이상의 수식어가 없습니다 — 이 코드가 최종 분류입니다.<\u002Fp>\n            <\u002Fsc-if>\n\n            <div style=\"display:grid;gap:6px\">\n              <sc-for list=\"{{ idxMods }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <button sc-camel-on-click=\"{{ m.go }}\" style=\"display:grid;grid-template-columns:1fr 100px 70px;gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid var(--color-divider);border-radius:var(--r-box);padding:9px 12px;cursor:pointer;font-family:var(--font-body);color:var(--color-text)\" style-hover=\"background:var(--color-accent-100);border-color:var(--color-accent)\">\n                  <span>\n                    <span style=\"font-size:14px\">– {{ m.mod }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"mono\" style=\"font-weight:700;color:var(--color-accent-800)\">{{ m.code }}<\u002Fspan>\n                  <span class=\"text-muted\" style=\"font-size:11px;text-align:right\">{{ m.deeper }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ idxConfirm }}\" disabled=\"{{ idxCannotConfirm }}\">이 코드로 확정<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ idxBack }}\">한 단계 위로<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px\">\n            <div class=\"card\" style=\"padding:18px\">\n                            <h6 style=\"margin:0\">진료 시점 기준 버전<\u002Fh6>\n              <div class=\"field\" style=\"margin-top:8px\">\n                <label>진료일<\u002Flabel>\n                <input class=\"input mono\" type=\"date\" value=\"{{ visitDate }}\" sc-camel-on-change=\"{{ onVisitDate }}\">\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--color-divider);padding-top:10px\">\n                <span class=\"mono\" style=\"font-size:20px;font-weight:700;color:var(--color-accent-800)\">{{ verName }}<\u002Fspan>\n                <span class=\"text-muted mono\" style=\"font-size:11px\">{{ verRange }}<\u002Fspan>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:12px;margin:4px 0 0\">{{ verNote }}<\u002Fp>\n              <div class=\"hr\"><\u002Fdiv>\n              <div style=\"display:grid;gap:6px\">\n                <sc-for list=\"{{ versions }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font-size:12px\">\n                    <span class=\"mono\">{{ v.name }}<\u002Fspan>\n                    <span class=\"text-muted mono\" style=\"font-size:11px\">{{ v.range }}<\u002Fspan>\n                    <span class=\"{{ v.tagClass }}\" style=\"justify-self:end\">{{ v.state }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div class=\"card\" style=\"padding:18px\">\n                            <h6 style=\"margin:0\">개정 간 코드 변경 이력<\u002Fh6>\n              <div style=\"display:grid;gap:12px;margin-top:10px\">\n                <sc-for list=\"{{ codeHistory }}\" as=\"h\" hint-placeholder-count=\"3\">\n                  <div style=\"border-bottom:1px solid var(--color-divider);padding-bottom:10px\">\n                    <div style=\"display:flex;gap:8px;align-items:baseline\">\n                      <span class=\"mono\" style=\"font-weight:700;color:var(--color-accent-800)\">{{ h.code }}<\u002Fspan>\n                      <span style=\"font-size:13px\">{{ h.term }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:grid;gap:4px;margin-top:6px\">\n                      <sc-for list=\"{{ h.changes }}\" as=\"c\" hint-placeholder-count=\"3\">\n                        <div style=\"display:grid;grid-template-columns:84px 74px 1fr;gap:8px;align-items:center;font-size:12px\">\n                          <span class=\"{{ c.cls }}\">{{ c.ver }}<\u002Fspan>\n                          <span class=\"mono\">{{ c.code }}<\u002Fspan>\n                          <span class=\"text-muted\">{{ c.note }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNlp }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:16px\">\n          <div>\n            <h2 style=\"margin:0\">AI 자동 코딩 · 임상 텍스트 분석<\u002Fh2>\n            <p class=\"text-muted\" style=\"font-size:13px;margin:4px 0 0\">의무기록 서식을 붙여 넣으면 진단 문구를 추출하고, 서식 섹션 우선순위와 자원소비 신호로 주진단 · 부진단을 제안합니다.<\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding:18px;gap:14px\">\n                        <h6 style=\"margin:0\">문서 첨부 — 소견서 · 진단서 · 진료의뢰서<\u002Fh6>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start\">\n              <div sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"border:1px dashed {{ dropBorder }};background:{{ dropBg }};padding:14px;display:grid;gap:10px;align-content:center;min-height:210px\">\n                <div style=\"display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center\">\n                  <label class=\"btn btn-secondary\" style=\"cursor:pointer;flex:none\">\n                    파일 선택\n                    <input type=\"file\" multiple=\"true\" accept=\".pdf,.jpg,.jpeg,.png,.txt,image/jpeg,image/png,application/pdf\" sc-camel-on-change=\"{{ onPickFiles }}\" style=\"position:absolute;width:0;height:0;opacity:0\">\n                  <\u002Flabel>\n                  <sc-if value=\"{{ isDesktop }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ capSnip }}\" title=\"Windows 캡처 도구 실행 (Win + Shift + S) — 캡처하면 자동 첨부\" style=\"flex:none;display:flex;gap:6px;align-items:center\">\n                    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>화면 캡처\n                  <\u002Fbutton>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n                    <label class=\"btn btn-primary\" style=\"cursor:pointer;flex:none;display:flex;gap:6px;align-items:center\">\n                      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3\"><\u002Fcircle><\u002Fsvg>카메라 촬영\n                      <input type=\"file\" accept=\"image/*\" capture=\"environment\" sc-camel-on-change=\"{{ onPickFiles }}\" style=\"position:absolute;width:0;height:0;opacity:0\">\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                  <span style=\"display:grid;gap:2px;min-width:0\">\n                    <span style=\"font-size:13px\">{{ capHint }}<\u002Fspan>\n                    <span class=\"text-muted\" style=\"font-size:11px\">PDF · JPG · PNG · TXT — 여러 개 동시 첨부<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ hasDocSel }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;gap:8px;overflow-x:auto;justify-content:safe center;padding-top:8px;border-top:1px solid var(--color-divider)\">\n                    <sc-for list=\"{{ selPreviews }}\" as=\"p\" hint-placeholder-count=\"2\">\n                      <div title=\"{{ p.name }}\" style=\"flex:none;width:96px;display:grid;gap:4px\">\n                        <div style=\"{{ p.imgStyle }}\">\n                          <sc-if value=\"{{ p.noImg }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span class=\"mono text-muted\" style=\"font-size:11px\">{{ p.kind }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div class=\"text-muted mono\" style=\"font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ p.name }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:0;min-width:0\">\n                <sc-if value=\"{{ hasDocs }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px\">\n                    <span class=\"text-muted\" style=\"font-size:12px\">첨부 {{ docTotal }}개 · 선택 {{ docSelCount }}개<\u002Fspan>\n                    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleAllDocs }}\" style=\"font-size:12px\">{{ allDocLabel }}<\u002Fbutton>\n                      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ deleteSelected }}\" style=\"font-size:12px\">선택 삭제<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:2px\">\n                    <sc-for list=\"{{ docs }}\" as=\"d\" hint-placeholder-count=\"2\">\n                      <div style=\"display: grid; grid-template-columns: 22px 44px minmax(0,1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--color-divider); padding: 6px 8px; background: {{ d.rowBg }}\">\n                        <label class=\"radio\" style=\"gap:0;cursor:pointer\">\n                          <input type=\"checkbox\" checked=\"{{ d.sel }}\" sc-camel-on-change=\"{{ d.toggle }}\" style=\"position:absolute;opacity:0;width:0;height:0\">\n                          <span class=\"dot\" style=\"border-radius:4px;background:{{ d.fill }};border-color:var(--color-accent)\"><\u002Fspan>\n                        <\u002Flabel>\n                        <div style=\"width:44px;height:36px;border:1px solid var(--color-divider);border-radius:var(--r-box);display:grid;place-items:center;overflow:hidden\">\n                          <sc-if value=\"{{ d.hasThumb }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"{{ d.thumbStyle }}\"><\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ d.noThumb }}\" hint-placeholder-val=\"{{ true }}\">\n                            <span class=\"mono text-muted\" style=\"font-size:10px\">{{ d.kind }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"display:grid;gap:3px;min-width:0\">\n                          <div title=\"{{ d.name }}\" style=\"font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}<\u002Fdiv>\n                          <div style=\"display:flex;gap:6px;align-items:center;min-width:0\">\n                            <span class=\"text-muted mono\" style=\"font-size:11px;white-space:nowrap\">{{ d.kind }} · {{ d.size }}<\u002Fspan>\n                            <span class=\"{{ d.statusClass }}\" title=\"{{ d.statusFull }}\" style=\"font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block\">{{ d.status }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ d.remove }}\" style=\"font-size:12px\">삭제<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ noDocSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"border:1px dashed var(--color-accent);border-radius:var(--r-box);padding:14px;text-align:center\">\n                      <p class=\"text-muted\" style=\"font-size:13px;margin:0\">선택한 파일이 없습니다.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ noDocSel }}\" hint-placeholder-val=\"{{ false }}\">\n                    <p class=\"text-muted\" style=\"font-size:12px;margin:8px 0 0\">선택한 파일이 없습니다.<\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ noDocs }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"border:1px solid var(--color-divider);padding:14px;display:grid;gap:4px\">\n                    <span style=\"font-size:13px\">첨부 파일 목록<\u002Fspan>\n                    <span class=\"text-muted\" style=\"font-size:12px\">첨부한 파일이 여기에 표시됩니다. 판독할 파일만 체크하세요.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end\">\n              <div class=\"field\">\n                <label>판독 엔진<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ ocrEngine }}\" sc-camel-on-change=\"{{ onOcrEngine }}\">\n                  <option>브라우저 내장 판독 (무료 · 키 불필요)<\u002Foption>\n                  <option>Google Cloud Vision<\u002Foption>\n                  <option>Azure AI Vision<\u002Foption>\n                  <option>원내 자체 호스팅 OCR<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <sc-if value=\"{{ isFreeOcr }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"field\">\n                  <label>인식 언어<\u002Flabel>\n                  <sc-raw-select class=\"input\" value=\"{{ ocrLang }}\" sc-camel-on-change=\"{{ onOcrLang }}\">\n                    <option>한국어 + 영어<\u002Foption>\n                    <option>한국어<\u002Foption>\n                    <option>영어<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ needKey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>{{ keyLabel }}<\u002Flabel>\n                  <input class=\"input mono\" type=\"password\" value=\"{{ ocrKey }}\" placeholder=\"인증키\" sc-camel-on-change=\"{{ onOcrKey }}\">\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ needEndpoint }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>엔드포인트<\u002Flabel>\n                  <input class=\"input mono\" value=\"{{ ocrEndpoint }}\" placeholder=\"https://…\" sc-camel-on-change=\"{{ onOcrEndpoint }}\">\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ runOcr }}\">{{ ocrLabel }}<\u002Fbutton>\n                <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ clearDocs }}\">첨부 비우기<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:11px;margin:0\">\n              {{ keyHint }}\n              판독 결과는 아래 본문에 추가됩니다 — 원문과 대조한 뒤 분석하세요. PDF는 이미지(JPG · PNG)로 변환해 첨부해야 합니다.\n              이미지는 판독을 실행할 때만 선택한 제공자에게 전송됩니다. 환자 식별정보가 포함된 문서의 외부 전송은 원내 개인정보 규정을 먼저 확인하세요.\n            <\u002Fp>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding:18px;gap:12px\">\n                        <div class=\"field\">\n              <label>의무기록 본문 (입원사유 · 과거력 · 검사 · 치료경과 · 최종진단)<\u002Flabel>\n              <textarea class=\"input\" rows=\"10\" value=\"{{ note }}\" sc-camel-on-change=\"{{ onNote }}\" style=\"font-family:var(--font-body);line-height:1.6;resize:vertical\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ analyze }}\">사전 분석<\u002Fbutton>\n              <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ aiRun }}\" disabled=\"{{ aiRunning }}\">{{ aiLabel }}<\u002Fbutton>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ clearNote }}\">비우기<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center\">\n              <label class=\"radio\" style=\"gap:8px;cursor:pointer;font-size:13px\">\n                <input type=\"checkbox\" checked=\"{{ autoClearNote }}\" sc-camel-on-change=\"{{ toggleAutoClear }}\" style=\"position:absolute;opacity:0;width:0;height:0\">\n                <span class=\"dot\" style=\"border-radius:4px;background:{{ autoClearFill }};border-color:var(--color-accent)\"><\u002Fspan>\n                선택한 파일이 없으면 본문 · 분석 결과 자동 비우기\n              <\u002Flabel>\n              <span class=\"text-muted\" style=\"font-size:11px\">첨부 파일을 모두 삭제하거나 선택을 모두 해제하면 위 본문과 사전 분석 · AI 해석 결과를 함께 지웁니다.<\u002Fspan>\n            <\u002Fdiv>\n            <p class=\"text-muted\" style=\"font-size:11px;margin:0\">섹션 가중치 — 최종·퇴원진단 1.00 / 입원사유 0.72 / 부진단 0.62 / 치료경과 0.58 / 검사 0.45 / 과거력 0.18. 자원소비 신호(수술 · 중환자실 · 투석 · 항암 등)가 주진단 순위를 올립니다.<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasNlp }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"padding:18px\">\n                            <h6 style=\"margin:0\">추출 진단 및 주 · 부진단 제안<\u002Fh6>\n              <div style=\"display:grid;gap:8px;margin-top:10px\">\n                <sc-for list=\"{{ nlpRows }}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:92px 1fr 130px 110px;gap:12px;align-items:center;border:1px solid var(--color-divider);border-radius:var(--r-box);padding:10px 12px\">\n                    <span class=\"mono\" style=\"font-size:18px;font-weight:700;color:var(--color-accent-800)\">{{ n.code }}<\u002Fspan>\n                    <div>\n                      <div style=\"display:flex;gap:8px;align-items:baseline;flex-wrap:wrap\">\n                        <span class=\"{{ n.roleClass }}\">{{ n.role }}<\u002Fspan>\n                        <span style=\"font-size:14px\">{{ n.label }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div class=\"text-muted\" style=\"font-size:11px;margin-top:2px\">{{ n.reason }} · {{ n.unit }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"display:flex;justify-content:space-between;font-size:11px\">\n                        <span class=\"text-muted\">정확도<\u002Fspan>\n                        <span class=\"mono\" style=\"font-weight:700\">{{ n.pct }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"height:4px;background:var(--color-neutral-300);margin-top:4px\">\n                        <div style=\"height:4px;width:{{ n.barW }};background:var(--color-accent)\"><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ n.toClaim }}\" style=\"font-size:12px\">이력에 확정<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <p class=\"text-muted\" style=\"font-size:11px;margin:10px 0 0\">제안은 판단 보조 자료입니다. 주진단은 자원소비가 가장 컸던 진단을 코더가 최종 확정합니다.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hasAiRows }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"padding:18px\">\n                            <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline\">\n                <h6 style=\"margin:0\">AI 해석 결과<\u002Fh6>\n                <span class=\"text-muted\" style=\"font-size:11px\">AI 제안을 내부 사전으로 교차 검증한 결과입니다 — 최종 코드는 코더가 확정합니다<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:8px;margin-top:10px\">\n                <sc-for list=\"{{ aiRows }}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:92px 1fr 130px 110px;gap:12px;align-items:center;border:1px solid var(--color-divider);border-radius:var(--r-box);padding:10px 12px\">\n                    <span class=\"mono\" style=\"font-size:18px;font-weight:700;color:var(--color-accent-800)\">{{ a.code }}<\u002Fspan>\n                    <div>\n                      <div style=\"display:flex;gap:8px;align-items:baseline;flex-wrap:wrap\">\n                        <span class=\"{{ a.roleClass }}\">{{ a.role }}<\u002Fspan>\n                        <span style=\"font-size:14px\">{{ a.ko }}<\u002Fspan>\n                        <span class=\"text-muted mono\" style=\"font-size:11px\">{{ a.term }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div class=\"text-muted\" style=\"font-size:11px;margin-top:2px\">{{ a.why }}<\u002Fdiv>\n                      <div style=\"margin-top:4px\"><span class=\"{{ a.verifyClass }}\">{{ a.verify }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div>\n                      <div style=\"display:flex;justify-content:space-between;font-size:11px\">\n                        <span class=\"text-muted\">AI 확신도<\u002Fspan>\n                        <span class=\"mono\" style=\"font-weight:700\">{{ a.pct }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"height:4px;background:var(--color-neutral-300);margin-top:4px\">\n \n\n          <sc-if value=\"{{ isSysAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"card\" style=\"padding:18px;gap:12px\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline\">\n                <h6 style=\"margin:0\">Google 로그인 설정<\u002Fh6>\n                <span class=\"text-muted mono\" style=\"font-size:11px\">{{ authStatus }}<\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Google OAuth 클라이언트 ID (선택 — 비밀번호 대신 Google 계정으로 로그인)<\u002Flabel>\n                <input class=\"input mono\" value=\"{{ authDraftGoogle }}\" placeholder=\"0000000000-xxxxxxxx.apps.googleusercontent.com\" sc-camel-on-change=\"{{ onAuthGoogle }}\">\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n                <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveAuth }}\">설정 저장<\u002Fbutton>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetData }}\">이 브라우저의 저장 데이터 초기화<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isKcd }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;gap:16px\">\n          <h2 style=\"margin:0\">KCD 데이터 관리<\u002Fh2>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n            <div class=\"card\" style=\"padding:18px\">\n                            <div class=\"card-kicker\">방식 1<\u002Fdiv>\n              <div class=\"card-title\">파일 업로드<\u002Fdiv>\n              <p class=\"card-body\">통계청 KCD 분류표(엑셀 · CSV)를 올리면 코드 · 한글명 · 영문명 · 동의어 열을 자동으로 찾아 검색 색인에 합칩니다. 시스템 관리자가 올리면 공용 DB에 저장되어 모든 PC에 적용됩니다.<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <label class=\"btn btn-primary\" style=\"cursor:pointer;opacity:{{ kcdBusyOp }}\">\n                  {{ kcdBtn }}\n                  <input type=\"file\" accept=\".xlsx,.xls,.csv,.txt\" sc-camel-on-change=\"{{ onKcdFile }}\" disabled=\"{{ kcdBusy }}\" style=\"position:absolute;width:0;height:0;opacity:0\">\n                <\u002Flabel>\n                <sc-if value=\"{{ kcdLoaded }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ kcdClear }}\">적재 삭제<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div class=\"card-meta\">{{ uploadState }}<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px\">\n                <div style=\"border:1px solid var(--color-divider);padding:8px 10px;display:grid;gap:2px\"><span class=\"text-muted\" style=\"font-size:11px\">검색 대상 코드<\u002Fspan><b class=\"mono\" style=\"font-size:18px\">{{ kcdTotal }}<\u002Fb><\u002Fdiv>\n                <div style=\"border:1px solid var(--color-divider);padding:8px 10px;display:grid;gap:2px\"><span class=\"text-muted\" style=\"font-size:11px\">최말단(청구 가능)<\u002Fspan><b class=\"mono\" style=\"font-size:18px\">{{ kcdLeaf }}<\u002Fb><\u002Fdiv>\n                <div style=\"border:1px solid var(--color-divider);padding:8px 10px;display:grid;gap:2px\"><span class=\"text-muted\" style=\"font-size:11px\">데이터 출처<\u002Fspan><b style=\"font-size:13px\">{{ kcdSrc }}<\u002Fb><\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"text-muted\" style=\"font-size:11px\">{{ kcdHint }}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card\" style=\"padding:18px\">\n                            <div class=\"card-kicker\">방식 2<\u002Fdiv>\n              <div class=\"card-title\">공공 API 연동<\u002Fdiv>\n              <div class=\"field\" style=\"margin-top:8px\">\n                <label>엔드포인트<\u002Flabel>\n                <input class=\"input mono\" value=\"{{ apiUrl }}\" sc-camel-on-change=\"{{ onApiUrl }}\">\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>인증키<\u002Flabel>\n                <input class=\"input mono\" value=\"{{ apiKey }}\" placeholder=\"서비스 키\" sc-camel-on-change=\"{{ onApiKey }}\">\n              <\u002Fdiv>\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ testApi }}\">연결 테스트<\u002Fbutton>\n              <div class=\"card-meta\">{{ apiState }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"card\" style=\"padding:18px\">\n                            <div class=\"card-kicker\">방식 3<\u002Fdiv>\n              <div class=\"card-title\">AI 해석 연동<\u002Fdiv>\n              <p class=\"card-body\">약어 · 자유기재 용어를 해석해 후보 코드를 제안하고, 내부 사전으로 교차 검증합니다.<\u002Fp>\n              <div class=\"field\">\n                <label>해석 강도<\u002Flabel>\n                <sc-raw-select class=\"input\" value=\"{{ aiLevel }}\" sc-camel-on-change=\"{{ onAiLevel }}\">\n                  <option>보수적 — 사전 일치 우선<\u002Foption>\n                  <option>균형 — 사전 + AI 병행<\u002Foption>\n                  <option>적극적 — AI 추론 우선<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"card-meta\">사전 우선순위가 항상 AI 제안보다 높습니다.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"card\" style=\"padding:18px\">\n                        <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center\">\n              <h6 style=\"margin:0\">적재 현황<\u002Fh6>\n              <span class=\"text-muted mono\" style=\"font-size:12px\">{{ kcdMeta }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-raw-table class=\"table\" style=\"margin-top:8px\">\n              <sc-raw-thead>\n                <sc-raw-tr><sc-raw-th style=\"width:110px\">구분<\u002Fsc-raw-th><sc-raw-th>내용<\u002Fsc-raw-th><sc-raw-th style=\"width:120px\">건수<\u002Fsc-raw-th><sc-raw-th style=\"width:130px\">갱신일<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ kcdRows }}\" as=\"k\" hint-placeholder-count=\"4\">\n                  <sc-raw-tr>\n                    <sc-raw-td>{{ k.kind }}<\u002Fsc-raw-td>\n                    <sc-raw-td>{{ k.desc }}<\u002Fsc-raw-td>\n                    <sc-raw-td class=\"mono\">{{ k.count }}<\u002Fsc-raw-td>\n                    <sc-raw-td class=\"mono\" style=\"font-size:12px\">{{ k.at }}<\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fmain>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav aria-label=\"하단 메뉴\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--color-divider);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom)\">\n        <sc-for list=\"{{ mobileTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n          <a href=\"{{ t.href }}\" sc-camel-on-click=\"{{ t.go }}\" style=\"display:grid;place-items:center;min-height:56px;font-size:12px;text-decoration:none;color:{{ t.color }};box-shadow:inset 0 2px 0 {{ t.bar }}\"><span style=\"display:grid;justify-items:center;gap:3px\">{{ t.icon }}<span>{{ t.label }}<\u002Fspan><\u002Fspan><\u002Fa>\n        <\u002Fsc-for>\n        <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-expanded=\"{{ menuOpen }}\" style=\"min-height:56px;font-size:12px;background:transparent;border:0;font-family:var(--font-body);color:{{ moreColor }};box-shadow:inset 0 2px 0 {{ moreBar }};cursor:pointer\">더보기<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;bottom:20px;left:50%;transform:translateX(-50% 증후군\",\"aki\":\"급성 신손상\",\n  \"ich\":\"뇌내출혈\",\"sah\":\"거미막하출혈\",\"sdh\":\"경막하출혈\",\"edh\":\"경막외출혈\",\"tbi\":\"외상성 뇌손상\",\n  \"pud\":\"소화성 궤양\",\"ugib\":\"상부위장관 출혈\",\"lgib\":\"하부위장관 출혈\",\"gib\":\"위장관 출혈\",\n  \"sob\":\"호흡곤란\",\"doe\":\"운동시 호흡곤란\",\"loc\":\"의식소실\",\"rta\":\"교통사고\",\"ta\":\"교통사고\",\n  \"hcc\":\"간세포암\",\"rcc\":\"신세포암\",\"nsclc\":\"비소세포폐암\",\"sclc\":\"소세포폐암\",\"gbm\":\"교모세포종\",\n  \"pe\":\"폐색전증\",\"dvt\":\"심부정맥혈전증\",\"pvd\":\"말초혈관질환\",\"pad\":\"말초동맥질환\",\n  \"uti\":\"요로감염\",\"apn\":\"급성 신우신염\",\"bph\":\"전립선비대증\",\"gerd\":\"위식도역류병\",\"ibs\":\"과민성대장증후군\"\n};\n\n// 질의를 의학 지식으로 풀어쓴다 — 약어는 토큰 단위, 영문 용어는 어근 단위로 분해\nfunction expandQuery(query){\n  const raw = (query||\"\").trim();\n  const tokens = raw.split(/[\\s,]+/).filter(Boolean);\n  const out = [], notes = [];\n  tokens.forEach(tok=>{\n    const lower = tok.toLowerCase();\n    if(MED_ABBR[lower]){ out.push(MED_ABBR[lower]); notes.push(tok + \"=\" + MED_ABBR[lower]); return; }\n    if(!/[a-z]/i.test(tok)){ out.push(tok); return; }\n    // 영문 — 어근 · 접미사 분해 (겹치지 않게 긴 것부터 소비)\n    let rest = lower, hits = [];\n    MED_ROOTS.forEach(r=>{\n      const i = rest.indexOf(r[0]);\n      if(i >= 0){\n        hits.push({i:i, root:r[0], ko:r[1]});\n        rest = rest.slice(0,i) + \"#\".repeat(r[0].length) + rest.slice(i + r[0].length);\n      }\n    });\n    hits.sort((a,b)=>a.i - b.i);\n    // cystitis 처럼 '낭'이 염과 함께 오면 방광으로 본다\n    if(hits.some(h=>h.root===\"cyst\") && hits.some(h=>h.root===\"itis\"))\n      hits = hits.map(h=>h.root===\"cyst\" ? {i:h.i, root:\"cyst\", ko:\"방광\"} : h);\n    if(hits.length){\n      hits.forEach(h=>out.push(h.ko));\n      notes.push(tok + \" → \" + hits.map(h=>h.root + \"=\" + h.ko).join(\" + \"));\n    } else out.push(tok);\n  });\n  const ko = out.join(\" \");\n  return {ko:ko, changed: notes.length > 0, note: notes.join(\" · \")};\n}\n\n// 한 글자 부위 표기의 경계 규칙에 쓰는 목록\nconst ANAT_GROUP_OF = {};\nANATOMY.forEach((g,gi)=>g.forEach(a=>{ if(!(a in ANAT_GROUP_OF)) ANAT_GROUP_OF[a] = gi; }));\nconst ANAT_LONG = Object.keys(ANAT_GROUP_OF).filter(a=>a.length >= 2);\nconst DIS_ALL = [].concat.apply([], DISEASE);\nconst JOSA = \" 의에과와및이가은는을를도,·()/\";\n\nfunction hitAlias(text, a, excl){\n  if(a.length >= 2) return text.indexOf(a) >= 0;\n  const ex = excl[a] || \"\";\n  const isAnat = excl === ANAT_EXCL;\n  for(let i = text.indexOf(a); i >= 0; i = text.indexOf(a, i+1)){\n    const prev = i === 0 ? \" \" : text.charAt(i-1);\n    const next = text.charAt(i+1);\n    if(ex.indexOf(next) >= 0 && next) continue;\n    if(!isAnat){ return true; }\n    // 부위: 어절 시작에서만\n    if(!(i === 0 || JOSA.indexOf(prev) >= 0)) continue;\n    // 같은 위치에서 다른 그룹의 긴 부위 표기가 시작하면 그 부위로 본다 (손목 · 손가락 · 위팔뼈)\n    const gi = ANAT_GROUP_OF[a];\n    const longer = ANAT_LONG.some(L=>L.charAt(0)===a && ANAT_GROUP_OF[L]!==gi && text.substr(i, L.length)===L);\n    if(longer) continue;\n    // 뒤따르는 글자가 끝 · 조사 · 공백 · 질환 표기의 시작일 때만 부위로 인정 (위기 · 위쪽 등 배제)\n    const rest = text.slice(i+1);\n    const okNext = !next || JOSA.indexOf(next) >= 0\n      || DIS_ALL.some(d=>rest.indexOf(d)===0)\n      || ANAT_LONG.some(L=>L.charAt(0)===a && ANAT_GROUP_OF[L]===gi && text.substr(i, L.length)===L);\n    if(okNext) return true;\n  }\n  return false;\n}\nfunction parseConcept(q){\n  const t = (q||\"\").toLowerCase();\n  const anat = [], dis = [], groups = [];\n  ANATOMY.forEach((g,gi)=>{ if(g.some(a=>hitAlias(t, a, ANAT_EXCL))){ groups.push(gi); g.forEach(a=>{ if(anat.indexOf(a)<0) anat.push(a); }); } });\n  DISEASE.forEach(g=>{ if(g.some(a=>hitAlias(t, a, DIS_EXCL))) g.forEach(a=>{ if(dis.indexOf(a)<0) dis.push(a); }); });\n  return {anat, dis, groups, has: anat.length>0 || dis.length>0, both: anat.length>0 && dis.length>0};\n}\n// 후보 텍스트가 가리키는 부위 그룹 — 한글 표기 + 영문 어근 풀이까지 포함\nconst _grpCache = {};\nfunction anatGroupsOf(text){\n  const key = text || \"\";\n  if(_grpCache[key]) return _grpCache[key];\n  const t = key.toLowerCase();\n  const full = /[a-z]/.test(t) ? t + \" \" + expandQuery(t).ko : t;\n  const ou .sort((a,b)=>a.label.length-b.label.length);\n    mid.sort((a,b)=>a.label.length-b.label.length);\n    return pre.concat(mid, fz).slice(0,8);\n  }\n\n  fuzzySuggest(q){\n    if(!q || q.length < 2) return [];\n    const best = {}, meta = {};\n    const stems = stemsOf(q);\n    const exq = expandQuery(q);\n    const concept = parseConcept(q + \" \" + exq.ko);\n    FUZZY.forEach(f=>{\n      const k = f[0], label = f[1];\n      if(k === q) return;\n      const candText = k + \" \" + (f[2]||\"\");\n      const near = k.indexOf(q)>=0 || q.indexOf(k)>=0;\n      let s = near ? Math.max(0.72, similarity(q,k)) : similarity(q,k);\n      // 부위 × 질환 개념 일치 (뇌종양 → 뇌의 악성신생물 · 수막종 …)\n      const cs = conceptScore(concept, candText + \" \" + (/[a-z]/.test(k) ? expandQuery(k).ko : \"\"));\n      // 용어 풀이가 적용된 질의에서는 개념 일치가 철자 유사보다 우선한다\n      s = Math.max(s, exq.changed && cs >= 0.86 ? 0.95 : cs);\n      // 다른 장기를 가리키는 후보는 강등 (cystitis ↔ cholecystitis, hepatocellular ↔ 위암)\n      if(concept.groups.length && organConflict(concept, candText)) s = s * 0.45;\n      // 용어 풀이가 적용된 질의: 부위가 전혀 맞지 않는 후보는 철자 유사만으로 올라오지 못한다\n      // (cellulitis ← hepatocellular, cystic fibrosis ← cystitis 같은 글자 조각 일치 배제)\n      if(exq.changed && concept.groups.length && cs === 0){\n        const candFull = candText + \" \" + (/[a-z]/.test(k) ? expandQuery(k).ko : \"\");\n        const anatHit = concept.anat.some(a=>hitAlias(candFull.toLowerCase(), a, ANAT_EXCL));\n        if(!anatHit) s = 0;\n      }\n      // 관련 어간(복강 → 복막 · 복부 …)을 포함하면 후보로 올린다\n      if(s < 0.45 && stems.some(st=>k.indexOf(st) >= 0)) s = 0.5;\n      if(s < 0.45) return;\n      // 코드 기준 중복 제거 — 코드마다 점수가 가장 높은 표기 하나만 남긴다\n      const code = f[3];\n      if(!best[code] || best[code] < s){ best[code] = s; meta[code] = f; }\n    });\n    return Object.keys(best).map(code=>({\n      label: meta[code][1], score:best[code],\n      ko: meta[code][2], code: code,\n      pct: Math.round(best[code]*100) + \"%\"\n    })).sort((a,b)=>b.score-a.score || a.code.localeCompare(b.code)).slice(0,10);\n  }\n\n  // ── 의학 지식 계층 3: AI 의미 검색 (의학용어 · 약어 · KCD · 해부학 추론, 결과는 로컬 색인으로 검증)\n  saveGemKey(){\n    const k = (this.state.gemKeyInput || \"\").replace(/\\s+/g, \"\");\n    // AIza… (기존) · AQ.… (신규 형식) 모두 허용\n    if(!/^[A-Za-z0-9_.\\-]{20,}$/.test(k)){ this.toast(\"API 키 형식이 올바르지 않습니다. ‘키 복사’ 버튼으로 복사한 값을 그대로 붙여 넣으세요.\"); return; }\n    const u = this.state.user, adm = u && (isSys(u.role) || isOrgAdm(u.role));\n    const shared = adm && this.state.cloud && this.state.cloud.on;\n    try{ localStorage.removeItem(\"kcm_gemini_model\"); if(shared) localStorage.removeItem(\"kcm_gemini_key\"); else localStorage.setItem(\"kcm_gemini_key\", k); }catch(e){}\n    this.setState(shared ? {orgGemKey:k, gemKey:\"\", gemKeyInput:\"\", gemModel:\"\"} : {gemKey:k, gemKeyInput:\"\", gemModel:\"\"});\n    this.toast(shared ? \"Gemini 키를 기관 공용 키로 저장했습니다 — 모든 PC · 사용자가 함께 사용합니다.\" : \"Gemini 키를 이 브라우저에 저장했습니다.\");\n    const q = (this.state.aiSearch && this.state.aiSearch.q) || \"\";\n    if(q) setTimeout(()=>this.runAiSearch(q, true), 0);\n  }\n\n  // 사용 가능한 Gemini 모델 중 무료 등급에서 쓸 수 있는 최신 flash 계열을 자동 선택\n  async pickGemModel(key){\n    try { const c = localStorage.getItem(\"kcm_gemini_model\"); if(c) return c; } catch(e){}\n    if(!key){ const m = (this._cloudCfg && this._cloudCfg.geminiModel) || \"gemini-2.5-flash\"; this.setState({gemModel:m}); return m; }\n    let pick = \"gemini-2.5-flash\";\n    try {\n      const r = await fetch(\"https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=\" + encodeURIComponent(key));\n      if(r.status === 400 || r.status === 403) throw new Error(\"API 키가 유효하지 않습니다.\");\n      const j = await r.json();\n      const ms = (j.models || []).filter(m=>(m.supportedGenerationMethods||[]).indexOf(\"generateContent\")>=0)\n        .map(m=>String(m.name||\"\").replace(/^models\\//,\"\"))\n        .filter(n=>/^gemini-\\d+(\\.\\d+)?-flash$/.test(n));\n      // 무료 등급에서 가장 안정적인 2.5-flash 우선, 없으면 최신 flash\n      const ver = n=>parseFloat((n.match(/gemini-(\\d+(?:\\.\\d+)?)/)||[])[1]||\"0\");\n      ms.sort((a,b)=>ver(b)-ver(a));\n      if(ms.indexOf(\"gemini-2.5-flash\") >= 0) pick = \"gemini-2.5-flash\";\n      else if(ms.length) pick = ms[0];\n    } catch(e){ if(/유효하지/.test(e.message)) throw e; }\n    try { localStorage.setItem(\"kcm_gemini_model\", pick); } catch(e){}\n    this.setState({gemModel:pick});\n    return pick;\n  }\n\n  async geminiComplete(key, sys, user, schema){\n    const model = await this.pickGemModel(key);\n    const proxy = !key && this._sb && !this._cloudShared;\n    let url = \"https://generativelanguage.googleapis.com/v1beta/models/\" + model + \":generateContent?key=\" + encodeURIComponent(key);\n    const headers = {\"Content-Type\":\"application/json\"};\n    if(proxy){\n      const ss = await this._sb.auth.getSession();\n      const tok = ss && ss.data && ss.data.session && ss.data.session.access_token;\n      if(!tok) throw new Error(\"공용 AI를 쓰려면 Google로 로그인하세요.\");\n      url = this._cloudCfg.supabaseUrl.replace(/\\/$/,\"\") + \"/functions/v1/gemini\";\n      headers.Authorization = \"Bearer \" + tok; headers.apikey = this._cloudCfg.supabaseAnonKey;\n    }\n    const body = {\n      systemInstruction: {parts:[{text:sys}]},\n      contents: [{role:\"user\", parts:[{text:user}]}],\n      generationConfig: {temperature:0.15, topP:0.9, maxOutputTokens:4096, responseMimeType:\"application/json\", responseSchema:schema}\n    };\n    // 503(서버 과부하) · 500 · 429 · 404 → 잠시 대기 후 재시도, 그래도 안 되면 안정 모델로 자동 전환\n    // 키로 실제 사용 가능한 모델 목록을 조회 (지원 종료된 모델 404 방지)\n    let live = [];\n    if(!proxy){\n      try {\n        const lr = await fetch(\"https://generativelanguage.googleapis.com/v1beta/models?pageSize=200\", {headers:{\"x-goog-api-key\": key}});\n        if(lr.ok){\n          const lj = await lr.json();\n          live = (lj.models || []).filter(m=>(m.supportedGenerationMethods||[]).indexOf(\"generateContent\") >= 0)\n            .map(m=>String(m.name||\"\").replace(/^models\\//,\"\"))\n            .filter(n=>/^gemini-/.test(n) && /flash/.test(n) && !/image|tts|audio|live|embedding|thinking-exp/.test(n));\n          const ver = n=>parseFloat((n.match(/gemini-(\\d+(?:\\.\\d+)?)/)||[])[1]||\"0\");\n          const pv = n=>/preview|exp/.test(n) ? 1 : 0, lite = n=>/lite/.test(n) ? 1 : 0;\n          live.sort((a,b)=> pv(a)-pv(b) || lite(a)-lite(b) || ver(b)-ver(a));\n        }\n      } catch(e){}\n    }\n    const models = [model].concat(live, [\"gemini-flash-latest\", \"gemini-2.5-flash\", \"gemini-2.5-flash-lite\"]).filter((m,i,a)=>m && a.indexOf(m)===i).slice(0, 8);\n    if(!proxy){ delete headers.Authorization; headers[\"x-goog-api-key\"] = key; }\n    const wait = ms => new Promise(res=>setTimeout(res, ms));\n    let r = null, used = model, last = 0;\n    outer: for(const m of models){\n      const u = proxy ? url : \"https://generativelanguage.googleapis.com/v1beta/models/\" + m + \":generateContent\";\n      for(let t=0; t<2; t++){\n        r = await fetch(u, {method:\"POST\", headers, body:JSON.stringify(proxy ? {model:m, body} : body)});\n        last = r.status;\n        if(r.ok){ used = m; break outer; }\n        if(r.status === 400 || r.status === 403){ const tx = await r.text(); throw new Error(/API key/i.test(tx) ? \"Gemini API 키가 유효하지 않습니다.\" : \"Gemini 요청 오류 (\" + r.status + \")\"); }\n        if(r.status === 404) break;\n        if(r.status === 503 || r.status === 500 || r.status === 429){ await wait(t ? 2500 : 1200); continue; }\n        break;\n      }\n    }\n    if(!r || !r.ok){\n      if(last === 429) throw new Error(\"Gemini 무료 사용량을 잠시 초과했습니다. 1분 후 다시 시도하세요.\");\n      if(last === 503 || last === 500) throw new Error(\"Gemini 서버가 혼잡합니다 (\" + last + \"). 잠시 후 다시 시도하거나 ‘내장 AI’를 사용하세요.\");\n      if(last === 404) throw new Error(\"이 키로 사용할 수 있는 Gemini 모델을 찾지 못했습니다 (404). AI Studio에서 키의 프로젝트에 Generative Language API가 사용 설정되어 있는지 확인하세요.\");\n      throw new Error(\"Gemini 응답 오류 (\" + last + \")
